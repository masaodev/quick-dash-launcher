[package]
name = "qdl"
version = "0.1.0"
edition = "2021"
description = "QuickDashLauncher の CLI（起動中の本体へ依頼を中継する）"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
