# リリース自動化ワークフロー
# タグがプッシュされたときに、Windowsインストーラーを自動ビルドし、
# GitHub Releasesに公開するワークフロー
# 注意: 想定外の事態が発生した場合はユーザーに確認を求めること

name: Release

# トリガー条件:
# - v*形式のタグがプッシュされたとき（例: v1.0.0）→ ビルド＋GitHub Release公開
# - 手動実行（workflow_dispatch）→ ビルドのみ（Releaseは作成しない。依存更新後の検証用）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 権限設定（リリース作成とファイルアップロードに必要）
permissions:
  contents: write

jobs:
  release:
    # Windows環境で実行（Electronアプリのビルドに必要）
    # windows-latestはVisual Studio 18に更新されnode-gyp 11.5.0が認識できない
    # （unknown version undefined）ため、VS 2022を含む安定版windows-2022に固定する
    runs-on: windows-2022

    steps:
      # リポジトリのコードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v7

      # Node.js環境のセットアップ（バージョン24を使用、ローカル開発環境と揃える）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Python環境のセットアップ（node-gyp安定化のため3.11を固定）
      # ランナー標準のPython 3.14はnode-gypと相性問題を起こすため明示的に固定する
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 依存関係のインストール（package-lock.jsonを使用した確実なインストール）
      # GYP_MSVS_VERSION: node-gypのVisual Studio自動検出（列挙時にmaxBuffer超過で失敗する）を
      # スキップし、VS 2022を明示指定する
      - name: Install dependencies
        run: npm ci
        env:
          GYP_MSVS_VERSION: '2022'

      # アプリケーションのビルドとWindowsインストーラーの作成
      # npm run dist は内部で npm run build を実行し、その prebuild でライセンスファイルも生成される
      - name: Build and package
        run: npm run dist -- --publish never
        env:
          GYP_MSVS_VERSION: '2022'

      # タグ名からバージョン番号を抽出（v1.0.0 → 1.0.0）
      # 以降のステップはタグプッシュ時のみ実行（手動実行時はビルド検証のみで終了）
      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      # ビルド結果のファイルを確認（デバッグ用）
      - name: List release directory
        if: startsWith(github.ref, 'refs/tags/v')
        run: dir release
        shell: cmd

      # リリースノートを組み立てる
      # 本文は注釈付きタグ（git tag -a）のメッセージ本文から取る（/release-version が作る）。
      # 軽量タグで本文が無ければ定型文にフォールバックする。末尾にインストール方法・ライセンスを付ける
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # checkout はタグを剥がして取得することがあるので、注釈オブジェクトを明示的に取り直す
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # 軽量タグだと %(contents:body) はコミット本文になるので、注釈付きタグのときだけ使う
          NOTES=""
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            NOTES="$(git tag -l --format='%(contents:body)' "$TAG")"
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="## 更新内容
          QuickDashLauncher $TAG のリリースです。"
          fi
          {
            printf '%s\n\n' "$NOTES"
            cat <<EOF
          ## インストール方法

          ### インストーラー版
          \`QuickDashLauncher-Setup-$VERSION.exe\` をダウンロードして実行してください。

          ### ポータブル版
          \`QuickDashLauncher-$VERSION.exe\` をダウンロードして任意の場所に配置してください。インストール不要で直接実行できます。

          ## ライセンス情報
          このソフトウェアはMITライセンスの下で公開されています。
          依存パッケージのライセンスについては、\`THIRD-PARTY-NOTICES.md\`を参照してください。
          EOF
          } > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      # GitHub Releaseの作成と成果物のアップロード
      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            THIRD-PARTY-NOTICES.md
