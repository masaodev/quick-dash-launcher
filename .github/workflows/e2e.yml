# E2E ワークフロー（Playwright + Electron）
# PR の CI（ci.yml）とは分け、main へのマージ（push）と手動起動で流す（準備を含めて 1 回 12 分ほどかかるため）。
# 画面や動きに関わる PR は、マージ前にブランチを指定して手動で流す（gh workflow run e2e.yml --ref <ブランチ>）。
# 続けてマージしたときは、古い実行を止めて最新のコミットだけを流す（concurrency）。
# GitHub の Windows ランナー（windows-2022）にもデスクトップの画面（1024x768）があるので、Electron のウィンドウを開ける。
# OS は英語版で、マウスのカーソルは画面の中央にある（テストはこの 2 つで結果が変わらないように書く）

name: E2E

on:
  workflow_dispatch:
    inputs:
      spec:
        description: '流す spec（空なら全件。例 tests/e2e/specs/multi-tab.spec.ts）'
        required: false
        default: ''
  # docs・Markdown・Claude の設定だけの変更では流さない
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # ci.yml・release.yml と同じ windows-2022（ネイティブモジュールのビルドをそろえるため）
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      # Windowsランナーは既定で改行をCRLFに変換するため止める（ci.yml と同じ）
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # node-gyp安定化のため3.11を固定（release.yml と同じ理由）
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          GYP_MSVS_VERSION: '2022'

      # ランナーの画面の大きさと、デスクトップのセッションがあるかを記録する（落ちたときの手がかり）
      - name: Show desktop info
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-Table DeviceName, Bounds, Primary -AutoSize
          Write-Host "UserInteractive: $([Environment]::UserInteractive)"
          Write-Host "Session: $((Get-Process -Id $PID).SessionId)"
          (Get-CimInstance Win32_OperatingSystem).Caption

      - name: E2E tests
        run: npm run test:e2e -- ${{ inputs.spec }}

      # 失敗したテストの画像とトレースを残す（https://trace.playwright.dev で開ける）
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
