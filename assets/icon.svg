<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa6f2"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2a5c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="4" y="4" width="248" height="248" rx="24" fill="url(#bg)"/>

  <!-- 検索バーと候補の行（薄い白の帯） -->
  <g fill="#fff" opacity="0.28">
    <rect x="22" y="22" width="212" height="62" rx="12"/>
    <rect x="22" y="102" width="212" height="34" rx="12"/>
    <rect x="22" y="146" width="212" height="34" rx="12"/>
    <rect x="22" y="190" width="212" height="34" rx="12"/>
  </g>

  <!-- Q（虫眼鏡を兼ねる） -->
  <g filter="url(#shadow)">
    <circle cx="124" cy="120" r="70" fill="none" stroke="#fff" stroke-width="34"/>
    <line x1="162" y1="160" x2="212" y2="210" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
