<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* トーストとレイアウト進捗で1ウィンドウを共用するため、
         bodyのモードクラス(mode-toast / mode-progress)で表示を切り替える */
      body {
        font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo UI', sans-serif;
        background: transparent;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }

      body:not(.mode-toast) .toast-container {
        display: none;
      }

      body:not(.mode-progress) .progress-container {
        display: none;
      }

      /* ===== トースト ===== */
      .toast-container {
        display: flex;
        align-items: flex-start;
        padding: 12px 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        max-width: 400px;
        min-height: 80px;
        background: #ffffff;
        color: #333;
      }

      .toast-container.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast-container.hide {
        opacity: 0;
        transform: translateY(-10px);
      }

      /* アイコン部分 */
      .toast-icon-wrapper {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        border-radius: 6px;
      }

      .toast-icon-wrapper img {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        object-fit: contain;
      }

      .toast-icon-wrapper .default-icon {
        font-size: 24px;
        line-height: 1;
      }

      /* コンテンツ部分 */
      .toast-content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .toast-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #333;
      }

      .toast-path {
        font-size: 11px;
        line-height: 1.3;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #666;
      }

      .toast-separator {
        height: 1px;
        background: #e0e0e0;
        margin: 6px 0;
      }

      .toast-action {
        font-size: 12px;
        line-height: 1.3;
        color: #666;
      }

      /* グループアイテム名リスト */
      .toast-items {
        font-size: 11px;
        line-height: 1.3;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #666;
      }

      /* シンプルメッセージ用（メインプロセスの警告・エラー。アイテムの操作は itemType + displayName のリッチ形式を使うこと） */
      .toast-simple {
        display: flex;
        align-items: center;
        min-height: 48px;
      }

      .toast-simple-icon {
        margin-right: 10px;
        font-size: 18px;
        flex-shrink: 0;
        color: #0078d4;
      }

      .toast-simple-message {
        font-size: 13px;
        line-height: 1.4;
        word-break: break-word;
        color: #666;
      }

      /* ===== レイアウト進捗 ===== */
      /* 行ごとに今していることを右に文字で出す。高さは中身を測って main に伝え、ウィンドウを合わせる */
      .progress-container {
        background: #ffffff;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        flex-direction: column;
        height: 100vh;
        opacity: 0;
        transform: scale(0.95);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        -webkit-app-region: drag;
      }

      body.mode-progress .progress-container {
        display: flex;
      }

      .progress-container.visible {
        opacity: 1;
        transform: scale(1);
      }

      .progress-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #e0e0e0;
        flex-shrink: 0;
      }

      .progress-header h2 {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }

      .progress-count {
        flex-shrink: 0;
        font-size: 12px;
        color: #666;
      }

      .progress-bar-container {
        height: 3px;
        background: #e8e8e8;
        flex-shrink: 0;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0;
        background: #4caf50;
        transition: width 0.3s ease;
      }

      .entry-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px;
        -webkit-app-region: no-drag;
      }

      .entry-list::-webkit-scrollbar {
        width: 4px;
      }

      .entry-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .entry-list::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 2px;
      }

      .entry-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 4px;
      }

      .entry-item + .entry-item {
        margin-top: 2px;
      }

      .entry-item.launching {
        background: #eaf3fd;
      }

      .entry-item.failed {
        background: #fdeeee;
      }

      /* 順番待ちと飛ばした行は薄く */
      .entry-item.waiting .entry-icon,
      .entry-item.waiting .entry-title,
      .entry-item.skipped .entry-icon,
      .entry-item.skipped .entry-title {
        opacity: 0.55;
      }

      .entry-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .entry-icon img {
        width: 20px;
        height: 20px;
        object-fit: contain;
      }

      .entry-icon .default-icon {
        font-size: 15px;
        line-height: 1;
      }

      .entry-content {
        flex: 1;
        min-width: 0;
      }

      .entry-title {
        color: #333;
        font-size: 12px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .entry-sub {
        color: #888;
        font-size: 10.5px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .entry-sub:empty {
        display: none;
      }

      /* 失敗・飛ばした理由は全文を読めるよう折り返す（失敗だけ赤） */
      .entry-sub.reason {
        white-space: normal;
        word-break: break-all;
      }

      .entry-item.failed .entry-sub.reason {
        color: #c62828;
      }

      .entry-status {
        flex-shrink: 0;
        max-width: 55%;
        font-size: 10.5px;
        line-height: 1.5;
        padding: 1px 8px;
        border-radius: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: #eee;
        color: #888;
      }

      .entry-status.launching {
        background: #dcebfb;
        color: #1565c0;
      }

      .entry-status.success {
        background: #e6f4ea;
        color: #1e7e34;
      }

      .entry-status.failed {
        background: #fbdcdc;
        color: #c62828;
      }

      .entry-status.skipped {
        color: #777;
      }

      .progress-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-top: 1px solid #e0e0e0;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }

      .progress-footer-text {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .btn {
        padding: 4px 16px;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }

      /* 中止は押すとそこで止まるだけなので、目立たせすぎない */
      .btn-cancel {
        background: #ffffff;
        color: #444;
        border: 1px solid #bbb;
      }

      .btn-cancel:hover {
        background: #f2f2f2;
      }

      .btn-close {
        background: #0078d4;
        color: white;
      }

      .btn-close:hover {
        background: #1a88e0;
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast-container"></div>

    <div class="progress-container" id="container">
      <div class="progress-header">
        <span class="entry-icon"><span class="default-icon">📦</span></span>
        <h2 id="layoutName"></h2>
        <span class="progress-count" id="progressText">0 / 0</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="entry-list" id="entryList"></div>
      <div class="progress-actions">
        <span class="progress-footer-text" id="footerText"></span>
        <button class="btn btn-cancel" id="actionBtn"></button>
      </div>
    </div>

    <script>
      // ===== トースト =====

      // 種別ごとのアイコン。文言は表示言語に合わせて main が決めて data.text で送る
      //（overlayWindowService.ts の buildToastText。辞書の toast.*）
      const itemTypeIcons = {
        url: '🌐',
        app: '⚙️',
        file: '📄',
        folder: '📁',
        customUri: '🔗',
        windowSwitch: '🪟',
        set: '📦',
        windowOperation: '🪟',
        windowActivate: '🔄',
        windowClose: '✖️',
        windowPin: '📌',
        windowUnpin: '🔓',
        windowMoveDesktop: '➡️',
        workspaceAdd: '⭐',
        clipboard: '📋',
        bookmarkImport: '🔖',
      };

      const DEFAULT_ICON = '📋';

      // シンプルメッセージ用のアイコン
      const legacyIcons = {
        success: '✓',
        error: '✕',
        info: 'ℹ',
        warning: '⚠',
      };

      function getDefaultIcon(itemType) {
        return itemTypeIcons[itemType] || DEFAULT_ICON;
      }

      // パス省略（40文字超で中間省略）
      function truncatePath(path, maxLength = 40) {
        if (!path || path.length <= maxLength) return path;
        return path.substring(0, 15) + '...' + path.substring(path.length - 20);
      }

      // HTMLエスケープ
      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // アイコンHTML生成
      function buildIconHtml(icon, itemType) {
        const fallback = getDefaultIcon(itemType);
        if (icon) {
          // 読み込めなかったときは下の error の監視が既定のアイコンに差し替える（CSP がインラインのハンドラーを許さないため）
          return `<img src="${escapeHtml(icon)}" alt="" data-fallback="${escapeHtml(fallback)}" />`;
        }
        return `<span class="default-icon">${fallback}</span>`;
      }

      // 新形式トーストのコンテンツ部分を生成
      function buildItemContent(data) {
        const { itemType, displayName, path } = data;
        const text = data.text || { action: data.message || '' };
        let html = `<div class="toast-title">${escapeHtml(displayName)}</div>`;

        if (itemType === 'set') {
          html += `<div class="toast-items">${escapeHtml(text.groupItems || '')}</div>`;
          html += '<div class="toast-separator"></div>';
          html += `<div class="toast-action">${escapeHtml(text.action)}</div>`;
        } else {
          if (path) {
            html += `<div class="toast-path">${escapeHtml(truncatePath(path))}</div>`;
          }
          html += '<div class="toast-separator"></div>';
          html += `<div class="toast-action">${escapeHtml(text.action)}</div>`;
        }

        return html;
      }

      // IPC経由でトースト表示リクエストを受け取る
      if (window.electronAPI && window.electronAPI.onShowToast) {
        window.electronAPI.onShowToast((data) => {
          showToast(data);
        });
      }

      function showToast(data) {
        const { message, type = 'success', duration = 2500, itemType, displayName } = data;

        document.body.className = 'mode-toast';

        const toast = document.getElementById('toast');
        toast.className = 'toast-container ' + type;

        if (itemType && displayName) {
          // リッチ形式（推奨: 新規追加時はこちらを使うこと）
          toast.innerHTML =
            '<div class="toast-icon-wrapper">' +
            buildIconHtml(data.icon, itemType) +
            '</div>' +
            '<div class="toast-content">' +
            buildItemContent(data) +
            '</div>';
        } else {
          // シンプル形式（メインプロセスの警告・エラー: データファイル破損・読込警告・ホットキー再登録失敗など）
          toast.innerHTML =
            '<div class="toast-simple">' +
            `<span class="toast-simple-icon">${legacyIcons[type] || legacyIcons.success}</span>` +
            `<span class="toast-simple-message">${escapeHtml(message || '')}</span>` +
            '</div>';
        }

        requestAnimationFrame(() => {
          toast.classList.add('show');
        });

        setTimeout(() => {
          toast.classList.remove('show');
          toast.classList.add('hide');
        }, duration);
      }

      // ===== レイアウト進捗 =====
      // 文言は表示言語に合わせて main が決めて送る（行の statusText・detail、data.labels。
      // setExecutor.ts。辞書の set.progress.*）

      let isComplete = false;
      let autoCloseTimer = null;
      let lastSentHeight = 0;

      // 行の右に出す文字の前に付ける記号
      const statusMarks = {
        waiting: '',
        launching: '⟳ ',
        success: '✓ ',
        failed: '✗ ',
        skipped: '－ ',
      };

      let renderedEntryCount = 0;

      function buildEntryIconHtml(entry) {
        // アイコンが無い行（パスを書いた行でキャッシュに無い・動かすだけの行）は種別の既定のアイコン
        return '<span class="entry-icon">' + buildIconHtml(entry.icon, entry.itemType) + '</span>';
      }

      function buildEntryHtml(entry) {
        return (
          '<div class="entry-item" data-index="' +
          entry.index +
          '">' +
          buildEntryIconHtml(entry) +
          '<div class="entry-content">' +
          '<div class="entry-title" title="' +
          escapeAttr(entry.windowTitle) +
          '">' +
          escapeHtml(entry.windowTitle) +
          '</div>' +
          '<div class="entry-sub"></div>' +
          '</div>' +
          '<span class="entry-status"></span>' +
          '</div>'
        );
      }

      // 行の状態・右の文字・名前の下の 1 行を今の状態にする
      function applyEntryState(el, entry) {
        el.className = 'entry-item ' + entry.status;
        const statusEl = el.querySelector('.entry-status');
        const text = (statusMarks[entry.status] || '') + (entry.statusText || '');
        statusEl.className = 'entry-status ' + entry.status;
        statusEl.textContent = text;
        statusEl.title = text;
        // 失敗・飛ばした行は理由を、それ以外は exe 名と置く先のデスクトップを出す
        const subEl = el.querySelector('.entry-sub');
        const showReason =
          (entry.status === 'failed' || entry.status === 'skipped') && entry.errorMessage;
        subEl.className = showReason ? 'entry-sub reason' : 'entry-sub';
        subEl.textContent = showReason ? entry.errorMessage : entry.detail || '';
      }

      // 中身の高さを測って main に伝える（ウィンドウの高さを合わせる。上限を超えたら一覧がスクロールする）
      function reportContentHeight() {
        const container = document.getElementById('container');
        const list = document.getElementById('entryList');
        // 枠いっぱい（100vh）に伸ばした一覧の scrollHeight は枠より小さくならず、行が少ないときに
        // 縮まなくなるので、測るあいだだけ中身なりの高さに戻して測る（同じ処理の中なので画面には出ない）
        // 測ると一覧のスクロールが先頭に戻るので、位置を覚えて戻す
        const scrollTop = list.scrollTop;
        container.style.height = 'auto';
        list.style.flex = 'none';
        const height = container.offsetHeight;
        container.style.height = '';
        list.style.flex = '';
        list.scrollTop = scrollTop;
        if (Math.abs(height - lastSentHeight) <= 1) return;
        lastSentHeight = height;
        window.electronAPI.resizeLayoutProgressWindow(height);
      }

      function updateUI(data) {
        document.getElementById('layoutName').textContent = data.layoutName;
        const labels = data.labels || {};

        const successCount = data.entries.filter((e) => e.status === 'success').length;
        const failedCount = data.entries.filter((e) => e.status === 'failed').length;
        const skippedCount = data.entries.filter((e) => e.status === 'skipped').length;
        const completedCount = successCount + failedCount + skippedCount;
        const totalCount = data.entries.length;
        const percent = totalCount > 0 ? (completedCount / totalCount) * 100 : 0;

        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressText').textContent = data.isComplete
          ? labels.done || ''
          : completedCount + ' / ' + totalCount;

        const entryList = document.getElementById('entryList');
        if (renderedEntryCount !== totalCount) {
          entryList.innerHTML = data.entries.map(buildEntryHtml).join('');
          renderedEntryCount = totalCount;
        }
        data.entries.forEach((entry) => {
          const el = entryList.children[entry.index];
          if (el) applyEntryState(el, entry);
        });

        isComplete = data.isComplete;
        const btn = document.getElementById('actionBtn');
        const footer = document.getElementById('footerText');
        if (isComplete) {
          btn.textContent = labels.close || '×';
          btn.className = 'btn btn-close';
          footer.textContent = (labels.summary || '')
            .replace('{success}', successCount)
            .replace('{failed}', failedCount)
            .replace('{skipped}', skippedCount);
        } else {
          btn.textContent = labels.cancel || '×';
          btn.className = 'btn btn-cancel';
          footer.textContent = labels.escToStop || '';
        }
        reportContentHeight();
      }

      function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      }

      function handleAction() {
        if (isComplete) {
          closeWindow();
        } else {
          window.electronAPI.cancelLayout();
        }
      }

      function closeWindow() {
        const container = document.getElementById('container');
        container.classList.remove('visible');
        setTimeout(() => {
          window.electronAPI.closeLayoutProgressWindow();
        }, 200);
      }

      // IPC listeners
      window.electronAPI.onLayoutProgress('start', (data) => {
        if (autoCloseTimer) {
          clearTimeout(autoCloseTimer);
          autoCloseTimer = null;
        }
        document.body.className = 'mode-progress';
        renderedEntryCount = 0;
        lastSentHeight = 0;
        updateUI(data);
        const container = document.getElementById('container');
        container.classList.add('visible');
      });

      window.electronAPI.onLayoutProgress('update', (data) => {
        updateUI(data);
      });

      window.electronAPI.onLayoutProgress('complete', (data) => {
        updateUI(data);
        // 飛ばした行（動かすだけの行で、ウィンドウが開いていなかった）は失敗ではないので、自動で閉じる
        const allSuccess = data.entries.every(
          (e) => e.status === 'success' || e.status === 'skipped'
        );
        if (allSuccess && !data.isCancelled) {
          autoCloseTimer = setTimeout(() => {
            autoCloseTimer = null;
            closeWindow();
          }, 2000);
        }
      });

      document.getElementById('actionBtn').addEventListener('click', handleAction);

      // トーストのアイコンが読み込めなかったら既定のアイコンに差し替える（error は泡立たないので捕捉段階で受ける）
      document.addEventListener(
        'error',
        (e) => {
          const img = e.target;
          if (!(img instanceof HTMLImageElement) || img.dataset.fallback === undefined) return;
          const span = document.createElement('span');
          span.className = 'default-icon';
          span.textContent = img.dataset.fallback;
          img.replaceWith(span);
        },
        true
      );

      // Escapeキー（進捗モードのみ。トーストモードはfocusable:falseでキー入力なし）
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.body.classList.contains('mode-progress')) {
          e.preventDefault();
          handleAction();
        }
      });
    </script>
  </body>
</html>
